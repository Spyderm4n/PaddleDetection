pretrain_weights: /home/wisson/data/maxwell/global_JD/pre_train/pretrain.pdparams
_BASE_: [
  'coco_detection_global_jd.yml',
  'runtime_global_jd.yml',
  '../_base_/picodet_v2.yml',
  '../_base_/optimizer_300e.yml',
  '../_base_/picodet_416_reader.yml',
]

weights:
save_dir: runs/maxwell/global_jd/260211
find_unused_parameters: True
use_ema: true
epoch: 200
snapshot_epoch: 10

TrainReader:
  batch_size: 32

LearningRate:
  base_lr: 0.02
  schedulers:
  - name: CosineDecay
    max_epochs: 300
  - name: LinearWarmup
    start_factor: 0.1
    steps: 200
