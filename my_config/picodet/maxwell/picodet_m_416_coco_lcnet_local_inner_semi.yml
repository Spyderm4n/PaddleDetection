_BASE_:
  - ./picodet_m_416_coco_lcnet_local_inner.yml

use_gpu: true
epoch: 80
snapshot_epoch: 5
log_iter: 20

# Dispatch to Trainer_Semi_PicoDet
ssod_method: Semi_PicoDet

# Pretrained baseline weights (student initialisation)
# Set via CLI: -o pretrain_weights=<path>  or  pretrain_weights: <path>
weights: /home/wisson/code/PaddleDetection/tools/maxwell/local/baseline_260417.pdparams

# Semi-supervised training hyper-parameters (read by Trainer_Semi_PicoDet)
SemiTrain:
  # 这次 target 中允许出现的类别 id（按 0-based 类别索引）
  #      0        1        2       3       4         5
  #  [target, charger, contacts, cover, holder, inner_cover]
  # 你每次训练前根据具体任务修改
  # 例：只出现 target => [0]
  # 例：出现 target, contacts, inner_cover => [0, 2, 5]
  allowed_target_classes: [1, 2]

  # EMA teacher
  ema_decay: 0.999

  # Pseudo-label generation
  pseudo_score_thr: 0.4
  min_box_size: 8
  max_pseudo_num: 20

  # Loss weighting
  sup_weight: 1.0
  unsup_weight: 0.5
  unsup_warmup_epochs: 5

  # Evaluation
  eval_with_teacher: true

# ---------------------------------------------------------------------------
# Dataset definitions for Trainer_Semi_PicoDet
# ---------------------------------------------------------------------------
# TrainDataset  – labeled images (overrides base config)
TrainDataset:
  name: COCODataSet
  dataset_dir: /home/wisson/data/maxwell/local/training_semi
  image_dir: source
  anno_path: annotations/train_st.json
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet
  dataset_dir: /home/wisson/data/maxwell/local/training_semi
  image_dir: target
  anno_path: annotations/target_val.json
  allow_empty: true

UnsupTrainDataset:
  name: SemiCOCODataSet
  dataset_dir: /home/wisson/data/maxwell/local/training_semi
  image_dir: target
  anno_path: annotations/target_unlabeled.json
  data_fields: ['image']
  supervised: false

# ---------------------------------------------------------------------------
# SemiTrainReader – interleaved labeled + unlabeled loader
# Applies the same sample transforms to both splits, then weak/strong aug to
# the unlabeled split.  BatchRandomResize is used as the batch-level spatial
# transform so that images in each mini-batch share a common size.
# ---------------------------------------------------------------------------
SemiTrainReader:
  sample_transforms:
    - Decode: {}
    - RandomCrop: {}
    - RandomFlip: {prob: 0.5}
    - RandomDistort: {}
  weak_aug: []          # Photometric weak augmentation (none beyond sample)
  strong_aug: []          # Photometric strong augmentation for unlabeled branch

  sup_batch_transforms:
    - BatchRandomResize:
        target_size: [352, 384, 416, 448, 480]
        random_size: True
        random_interp: True
        keep_ratio: False
    - NormalizeImage: {is_scale: true, mean: [0.485, 0.456, 0.406],
                       std: [0.229, 0.224, 0.225]}
    - Permute: {}
    - PadGT: {}
  unsup_batch_transforms:
    - BatchRandomResize:
        target_size: [352, 384, 416, 448, 480]
        random_size: True
        random_interp: True
        keep_ratio: False
    - NormalizeImage: {is_scale: true, mean: [0.485, 0.456, 0.406],
                       std: [0.229, 0.224, 0.225]}
    - Permute: {}
    - PadGT: {}
  sup_batch_size: 8
  unsup_batch_size: 8
  shuffle: true
  drop_last: true

# ---------------------------------------------------------------------------
# Reference: original SemiDataSet paths (not used by the new trainer directly)
# ---------------------------------------------------------------------------
SemiDataSet:
  source_labeled:
    image_dir: /home/wisson/data/maxwell/local/training_semi/source
    anno_path: /home/wisson/data/maxwell/local/training_semi/annotations/source_train.json

  source_val:
    image_dir: /home/wisson/data/maxwell/local/training_semi/source
    anno_path: /home/wisson/data/maxwell/local/training_semi/annotations/source_val.json

  target_labeled:
    image_dir: /home/wisson/data/maxwell/local/training_semi/target
    anno_path: /home/wisson/data/maxwell/local/training_semi/annotations/target_labeled.json

  target_unlabeled:
    image_dir: /home/wisson/data/maxwell/local/training_semi/target
    anno_path: /home/wisson/data/maxwell/local/training_semi/annotations/target_unlabeled.json

  target_val:
    image_dir: /home/wisson/data/maxwell/local/training_semi/target
    anno_path: /home/wisson/data/maxwell/local/training_semi/annotations/target_val.json